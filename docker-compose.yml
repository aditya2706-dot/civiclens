services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: civiclens_backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civiclens_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NODE_ENV=production
      # Important to tell Next.js the backend URI within docker/from browser
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5001/api}
    depends_on:
      - backend
    restart: always
